name: Upload codeusagemonit 1.2.0 setup.exe

# Historical upload that kept the original 1.2.0 zip checksum. That zip contained
# personal usage figures. Do not restore it. Rebuilds go through release.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to republish the historical package
        run: |
          echo "This workflow no longer uploads codeusagemonit-setup-1.2.0.exe or edits SHA256SUMS.txt."
          echo "Use Actions → Build Windows release → replace_assets, tag v1.2.0."
          exit 1
