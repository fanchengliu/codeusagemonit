name: Publish codeusagemonit 1.2.0

# Historical republish of the original 1.2.0 zip. That package contained personal
# usage figures. Do not upload it again. Rebuilds go through release.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to republish the historical package
        run: |
          echo "This workflow no longer uploads codeusagemonit-1.2.0-win-x64.zip."
          echo "Use Actions → Build Windows release → replace_assets, tag v1.2.0."
          exit 1
