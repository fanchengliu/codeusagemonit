name: Windows self-test

# Temporary check for the Grok shared-quota port. Not part of the release pipeline.
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/grok-shared-quota-557b

jobs:
  self-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: .\source\Windows\build.ps1 -OutputDirectory .\verification\self-test

      - name: Run --self-test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path (Get-Location) 'verification\self-test\codeusagemonit.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow
          $report = Join-Path (Get-Location) 'verification\self-test\verification\tests.json'
          if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report -Raw }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
