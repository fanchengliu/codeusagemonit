name: Replace published release assets

# The one-shot push trigger already ran and replaced the v1.1.0 and v1.2.0
# assets. workflow_dispatch remains so it can be started from the Actions tab.
# Do not add a push trigger here; editing this file must not rebuild the releases.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v120:
    uses: ./.github/workflows/release.yml
    with:
      replace_assets: true
      tag: v1.2.0
    secrets: inherit
  v110:
    uses: ./.github/workflows/release.yml
    with:
      replace_assets: true
      tag: v1.1.0
    secrets: inherit
