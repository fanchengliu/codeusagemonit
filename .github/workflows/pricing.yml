# Rebuilds source/Windows/pricing.json from LiteLLM and models.dev once a day.
# The app downloads that file (Pricing.SyncAsync) and re-prices local usage with it.
name: Sync model prices

on:
  schedule:
    - cron: '17 2 * * *'   # 02:17 UTC every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pricing
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update pricing.json
        run: node tools/update-pricing.mjs source/Windows/pricing.json tools/pricing-upstream.json
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- source/Windows/pricing.json tools/pricing-upstream.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/Windows/pricing.json tools/pricing-upstream.json
          git commit -m "pricing: sync with LiteLLM and models.dev ($(date -u +%F))"
          git push
